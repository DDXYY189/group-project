spring:
  profiles:
    active: local

server:
  port: 8080

llm:
  api-key: ${DASHSCOPE_API_KEY:}
  text-model: qwen-plus
  vision-model: qwen-vl-plus
  intent-model: qwen-turbo
  image-model: wanx-v1
  tts-model: cosyvoice-v2
  tts-voice: longxiaochun_v2
  base-url: https://dashscope.aliyuncs.com/api/v1

wechat:
  enabled: true
  poll-interval: 1000
  auto-start: true

# 心知天气 API 配置
# 【此处填入心知天气API Key，从环境变量/配置文件读取，禁止写死在代码】
# 在 application-local.yml 中配置：seniverse.api-key: 你的API Key
# 或通过环境变量 SENIVERSE_API_KEY 注入
seniverse:
  api-key: ${SENIVERSE_API_KEY:}
