spring.application.name=demo
server.port=8080
spring.config.import=optional:classpath:application-local.properties

deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=deepseek-chat
deepseek.base-url=https://api.deepseek.com

seniverse.api-key=${SENIVERSE_API_KEY:}
seniverse.base-url=https://api.seniverse.com/v3/weather/now.json

voice.node-executable=node
voice.script-path=voice-tools/tts2silk.mjs

imagegen.api-key=${SILICONFLOW_API_KEY:}
imagegen.base-url=https://api.siliconflow.cn/v1/images/generations
imagegen.model=Kwai-Kolors/Kolors
imagegen.image-size=1024x1024
