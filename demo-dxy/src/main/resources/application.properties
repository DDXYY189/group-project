spring.application.name=group-demo
spring.profiles.active=local
server.port=8080
bot.merge-window-ms=8000
llm.api-key=${DASHSCOPE_API_KEY:}
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.model=qwen-plus
llm.vision-model=qwen-vl-plus
voice.ffmpeg-path=tools/ffmpeg/ffmpeg.exe
