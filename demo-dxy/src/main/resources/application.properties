spring.application.name=group-demo
spring.profiles.active=local
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/conversation-memory
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
bot.merge-window-ms=8000
llm.api-key=${DASHSCOPE_API_KEY:}
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.model=qwen-plus
llm.vision-model=qwen-vl-plus
llm.tool.max-rounds=5
llm.memory.max-turns=20
llm.memory.ttl-minutes=60
llm.memory.summary-enabled=true
llm.memory.summary-threshold-turns=30
llm.memory.recent-turns=10
rag.enabled=true
rag.top-k=3
voice.ffmpeg-path=tools/ffmpeg/ffmpeg.exe
voice.asr-url=https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
voice.asr-model=qwen-omni-turbo
voice.python-path=python
voice.tts-voice=zh-CN-XiaoxiaoNeural
voice.silk-pcm-rate=24000
voice.send-encode-type=4
voice.send-sample-rate=16000
image.base-url=https://dashscope.aliyuncs.com
image.model=wanx2.1-t2i-turbo
image.edit-model=qwen-image-edit
image.size=1024*1024
travel.page-dir=data/trips
travel.page-base-url=http://localhost:8080/api/trips
travel.generate-image=true
travel.generate-voice=true

# 美团开放平台：酒店/美食推荐（方案一：Agent 生成时静态写入网页）
meituan.enabled=true
meituan.mock-enabled=true
meituan.base-url=https://openapi.meituan.com
meituan.app-key=
meituan.secret=
meituan.auth-token=
# 按你申请到的接口文档填写真实端点，例如 /api/hotel/search
meituan.hotel-endpoint=
meituan.food-endpoint=
meituan.cache-ttl-seconds=3600
weather.base-url=https://api.seniverse.com/v3/weather/now.json
weather.language=zh-Hans
weather.unit=c
search.api-key=${ZHIPU_API_KEY:}
search.base-url=https://open.bigmodel.cn/api/paas/v4/chat/completions
search.model=glm-4-flash
search.engine=search_pro
search.max-results=8
news.base-url=https://60s.viki.moe/v2/60s
news.max-items=10

# MCP 客户端：默认开启，并连接同应用内的 MCP 演示 Server
mcp.enabled=true
mcp.demo-server-enabled=true
mcp.connect-timeout=10s
mcp.request-timeout=60s
mcp.servers.demo.type=http
mcp.servers.demo.url=http://localhost:${server.port:8080}
mcp.servers.demo.endpoint=/mcp/demo
# mcp.servers.everything.type=stdio
# mcp.servers.everything.command=npx
# mcp.servers.everything.args=-y,@modelcontextprotocol/server-everything

# 定时任务
scheduler.enabled=true
scheduler.daily-news-cron=0 30 8 * * *
scheduler.reminder-poll-ms=15000
scheduler.timezone=Asia/Shanghai
