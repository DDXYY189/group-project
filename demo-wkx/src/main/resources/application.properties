spring.application.name=demo-wkx

# === LLM Configuration ===
# DeepSeek API (OpenAI兼容接口)
# 申请API Key: https://platform.deepseek.com -> 注册 -> API Keys -> 创建Key
llm.api-key=YOUR_DEEPSEEK_API_KEY_HERE
llm.base-url=https://api.deepseek.com
llm.model=deepseek-chat
llm.system-prompt=你是一个友好的微信AI助手，请用简洁的中文回答用户的问题。当用户问你是谁时，说你是基于DeepSeek大模型的微信AI助手。

# === Server Configuration ===
server.port=8080
