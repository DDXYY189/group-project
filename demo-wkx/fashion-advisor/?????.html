<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2;url=http://127.0.0.1:5000/dashboard">
    <title>AI智能穿搭顾问 - 控制台</title>
    <style>
        body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Microsoft YaHei',sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); }
        .card { background:#fff; border-radius:16px; padding:48px 64px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        h1 { color:#333; margin:0 0 8px; font-size:28px; }
        p { color:#666; margin:0 0 24px; font-size:16px; }
        .btn { display:inline-block; padding:14px 48px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; text-decoration:none; border-radius:30px; font-size:18px; font-weight:600; transition:transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(102,126,234,0.4); }
        .hint { margin-top:24px; color:#999; font-size:13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AI 智能穿搭顾问</h1>
        <p>ClawBot 微信机器人控制台</p>
        <a href="http://127.0.0.1:5000/dashboard" class="btn">进入控制台</a>
        <div class="hint">页面将在2秒后自动跳转，或点击按钮直接进入</div>
    </div>
</body>
</html>
